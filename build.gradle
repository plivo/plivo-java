plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'checkstyle'
    id 'idea'
    id 'eclipse'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = 'com.plivo'
version = new File("${projectDir}/src/main/resources/com/plivo/api/version.txt").readLines().get(0)

repositories {
    mavenCentral()
    gradlePluginPortal()
}

java {
    withJavadocJar()
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile) {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    options.compilerArgs << "-Xlint:unchecked"
    options.compilerArgs << "-XDignore.symbol.file=true"
}

dependencies {
    testImplementation(platform('org.junit:junit-bom:5.10.0'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation('junit:junit:4.13.2')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testRuntimeOnly('org.junit.vintage:junit-vintage-engine')

    testImplementation 'com.squareup.okhttp:mockwebserver:2.7.5'

    implementation 'com.squareup.retrofit2:converter-jackson:2.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:2.3.2'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.2'
    implementation 'com.auth0:java-jwt:3.10.2'
}

checkstyle {
    toolVersion = '8.45.1'
    configFile = file("${projectDir}/config/checkstyle/checkstyle.xml")
    configProperties = [
        'checkstyle.cache.file': "${buildDir}/checkstyle.cache"
    ]
    showViolations = true
    sourceSets = [sourceSets.main, sourceSets.test]
    ignoreFailures = false
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    ignoreFailures = false
}

javadoc {
    title = "Plivo Java SDK"
    options.linkSource = true
}

jar {
    manifest {
        attributes(
            "Created-By": 'Plivo',
            'Implementation-Vendor': 'Plivo',
            'Implementation-Title': 'Plivo Java SDK',
            'Implementation-Version': version
        )
    }
}

shadowJar {
    archiveClassifier.set('all')
    archiveBaseName.set("plivo-java-${version}-jar-with-dependencies")
}

// Add fatJar task that depends on shadowJar
task fatJar {
    dependsOn shadowJar
}

// Sonatype Central Portal via the OSSRH Staging API bridge.
// io.codearte.nexus-staging (v0.30.0) only spoke the legacy s01.oss.sonatype.org API
// that Sonatype retired mid-2025 — every release after v5.46.0 (Apr 2025) uploaded
// nowhere. The gradle-nexus/publish-plugin v2+ handles the two-step upload → close →
// release flow against the new endpoint using the same MAVEN_USERNAME/MAVEN_PASSWORD
// user-token pair (issued at central.sonatype.com/account).
nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username.set(System.getenv("MAVEN_USERNAME") ?: (project.findProperty('mavenUserName') ?: ''))
            password.set(System.getenv("MAVEN_PASSWORD") ?: (project.findProperty('mavenPassword') ?: ''))
        }
    }
    connectTimeout = java.time.Duration.ofMinutes(5)
    clientTimeout = java.time.Duration.ofMinutes(5)
    transitionCheckOptions {
        maxRetries.set(180)
        delayBetween.set(java.time.Duration.ofSeconds(20))
    }
}

task createPom {
    doLast {
        def pomFile = file("$buildDir/pom.xml")
        pomFile.parentFile.mkdirs()
        pomFile.createNewFile()
        pomFile.text = """
<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
    <modelVersion>4.0.0</modelVersion>
    <groupId>${project.group}</groupId>
    <artifactId>plivo-java</artifactId>
    <version>${project.version}</version>
    <packaging>jar</packaging>
    <name>plivo-java</name>
    <description>A Java SDK to make voice calls &amp; send SMS using Plivo and to generate Plivo XML</description>
    <url>https://github.com/plivo/plivo-java/</url>
    
    <licenses>
        <license>
            <name>The MIT License</name>
            <url>https://github.com/plivo/plivo-java/blob/4.0/LICENSE.txt</url>
            <distribution>repo</distribution>
        </license>
    </licenses>
    
    <developers>
        <developer>
            <name>The Plivo SDKs Team</name>
            <email>sdks@plivo.com</email>
            <organization>Plivo, Inc.</organization>
            <organizationUrl>https://plivo.com</organizationUrl>
        </developer>
    </developers>
    
    <scm>
        <url>git@github.com:plivo/plivo-java.git</url>
        <connection>scm:git:git@github.com:plivo/plivo-java.git</connection>
        <developerConnection>scm:git:git@github.com:plivo/plivo-java.git</developerConnection>
    </scm>
</project>
"""
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            
            pom {
                name = 'plivo-java'
                packaging = 'jar'
                artifactId = 'plivo-java'
                description = 'A Java SDK to make voice calls & send SMS using Plivo and to generate Plivo XML'
                url = 'https://github.com/plivo/plivo-java/'

                scm {
                    connection = 'scm:git:git@github.com:plivo/plivo-java.git'
                    developerConnection = 'scm:git:git@github.com:plivo/plivo-java.git'
                    url = 'git@github.com:plivo/plivo-java.git'
                }

                licenses {
                    license {
                        name = 'The MIT License'
                        url = 'https://github.com/plivo/plivo-java/blob/4.0/LICENSE.txt'
                    }
                }

                organization {
                    name = 'Plivo'
                    url = 'https://api-reference.plivo.com/latest/net/introduction/overview'
                }

                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/plivo/plivo-java/issues'
                }

                developers {
                    developer {
                        name = 'The Plivo SDKs Team'
                        email = 'sdks@plivo.com'
                        organization = 'Plivo, Inc.'
                        organizationUrl = 'https://plivo.com'
                    }
                }
            }
        }
    }
    
    // No manual repositories { } block: nexus-publish adds a `sonatype` staging
    // repository whose URL comes from initializeSonatypeStagingRepository. Adding
    // one here would produce a second, non-staged target that skips close-and-release.
}

signing {
    required { !version.endsWith('SNAPSHOT') && gradle.taskGraph.hasTask("publish") }
    sign publishing.publications.mavenJava
}

application {
    mainClass = 'com.plivo.examples.Messages'
}

// Kept for compatibility with the plivo_standard_libs@sdks Jenkins pipeline that
// invokes `./gradlew upload`. Under the new plugin, `publish` only uploads to the
// staging repo — the release also needs closeAndRelease to promote to Central.
task upload {
    dependsOn 'publishToSonatype', 'closeAndReleaseSonatypeStagingRepository'
    doLast {
        println "Uploading artifacts completed"
    }
}
